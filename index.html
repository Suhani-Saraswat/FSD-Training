<!DOCTYPE html>

<body>
  <!-- <h1>Hello</h1>

  <button type="button" onClick='document.getElementById("demo").innerHTML="HelloWorld"'>Message</button> -->

  <p id="text"></p>
  <button onclick="toggletext()">Show /Hide</button>

  <script>
    function toggletext(){
      let t=document.getElementById("text");
      if(t.style.display == none){
        t.style.display = "black";
      }
      else{
        t.style.display="none";
      }
    }
  </script>
</body>
